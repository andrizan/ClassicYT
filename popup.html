<!DOCTYPE html>
  <html>
    <head>
    <meta charset="UTF-8">
      <style>
        body {
            min-width: 565px;
            max-width: 581px;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background-image: linear-gradient(135deg, #e2e2e2 0%, rgba(255,255,255,1) 50%, rgba(255,255,255,1) 100%);
            font-size: 12px;
            overflow: hidden;
            margin-top: 0;
        }
        button {
          max-width: 130px;
          outline: none;
          border:none;
          transition-duration:0.15s;
          background:none;
        }
        button:hover {
            transform: scale(1.05);
            transition-duration:0.15s;
            cursor:pointer;
            transition-timing-function: cubic-bezier(0.12, 3.4, 1, 1.27);
        }
        label {
            display:block;
        }
        fieldset {
            margin-bottom: 5px;
            padding: 0;
            border-width: 1px;
            border-color: rgb(0 0 0 / 10%);
            border-radius: 4px;
        }
        #header {
            text-align: center;
            font-size:20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            color: white;
            transform: scale(1.3, 1.3);
            pointer-events: none;
        }
        #header span::before,
        #header span::after {
            content: ' — ';
        }
        #donate-message {
            font-style: italic;
        }
        .pure {
            font-style: normal !important;
        }
        #donate img {
            height: 100%;
            width: 100%;
            margin-top: 8px;
            filter: drop-shadow( 0px 3px 2px rgba(0, 0, 0, 0.7));
            user-select: none;
        }
        input {
            margin: 0px 5px 0px 5px;
        }
        label {
            margin: 2px 0px 2px 0px;
        }
        .mini {
            max-width: 30px;
        }
        input[type="range"] {
            top:4px;
            position:relative;
            min-width: 75%;
        }
        .note {
            font-size:10px;
            margin-bottom:10px;
            text-align:right;
        }
        .tooltip {
            position: relative;
            display: block;
            margin-left: 5px;
            border-radius: 50%;
            border: 1px solid grey;
            color: grey;
            font-size: 10px;
            height: 14px;
            width: 14px;
            text-align: center;
            float: right;
            right: 20px;
        }
        .tooltip-warning {
            color: white;
            background-color: orange;
        }
        .tooltip::before {
            content: "?";
        }
        .tooltip-warning::before {
            content: "!";
        }
        .tooltip-text {
            display: none;
            background-image: linear-gradient(135deg, rgb(112, 111, 111), black);
            border: 1px solid black;
            color: white;
            text-align: left;
            border-radius: 4px;
            width: 200px;
            position: absolute;
            padding: 5px 5px 5px 5px;
            top: 50%;
            transform: translateY(-50%);
            right: 105%;
            z-index:2;
            max-height: 200px;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .tooltip-text {
            scrollbar-width: thin;
            scrollbar-color: white transparent;
        }
        .tooltip-text-small {
            display: none;
            background-image: linear-gradient(135deg, rgb(112, 111, 111), black);
            border: 1px solid black;
            color: white;
            text-align: left;
            border-radius: 4px;
            width: 130px;
            position: absolute;
            padding: 5px 5px 5px 5px;
            top: 50%;
            transform: translateY(-50%);
            right: 105%;
            z-index:2;
        }
        .tooltip:hover .tooltip-text, .tooltip:hover .tooltip-text-small {
            display: block;
        }
        .tooltip-text, .tooltip-text-small {
            white-space: pre-line;
        }
        .tooltip-warning-text {
            color: yellow;
        }

        .tooltip .tooltip-text::after, .tooltip .tooltip-text-small::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 100%;
            margin-top: -5px;
            margin-right: -10px;
            border-width: 5px;
            border-color: transparent transparent transparent black;
            border-style: solid;
        }
        .tooltip a {
            color: white;
        }
        .tooltip a:visited {
            color: white;
        }
        .subsetting::before {
            margin-left:5px;
            content:"┕";
            display: inline-block;
            opacity: 0.25;
        }
        .columns {
            column-count: 2;
            min-width: 545px;
        }
        .page {
            display: flex;
            flex: 0 0 100%;
            transition: all 0.3s ease;
        }
        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #all-pages {
            display:flex; 
            transition: all 0.3s ease;
        }
        .nav-arrow svg {
            height: 50px;
            width: auto;
            fill: black;
            stroke: white;
            stroke-width: 2px;
            transition-duration: 0.15s;
            transition-timing-function: cubic-bezier(0.12, 3.4, 1, 1.27);
        }
        .nav-arrow:not([disabled]):hover svg {
            cursor:pointer;
            transform: scale(1.25);
        }
        .nav-arrow[disabled] svg {
            fill: grey;
        }
        #left-arrow {
            filter: drop-shadow( 0px 3px 2px rgba(0, 0, 0, 0.7));
        }
        #right-arrow {
            filter: drop-shadow( 0px 3px 2px rgba(0, 0, 0, 0.7));
        }
        redux {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family:sans-serif;
            font-weight:bold;
        }
        redux::before,
        redux::after {
            content:"";
            border-bottom: 1px solid rgba(0, 0, 0, 0.3);
            flex-grow: 0.4;
        }
        redux:not(:empty)::before {
            margin-right: 0.5em;
        }
        redux:not(:empty)::after {
            margin-left: 0.5em;
        }
        select {
            border-top: none;
            border-right: none;
            border-bottom: none;
            border-left: none;
            background: none;
            outline: none;
            cursor:pointer;
            font-size:12px;
        }
        .logo-preview {
            position: absolute;
            background-color: black;
            top: 0;
            left: 0;
            transform: translate(-100%, -25%);
            display: none;
            background-color: white;
            border-radius: 10px;
            border: 1px solid grey;
            padding: 10px;
            justify-content: center;
            align-items: center;
            max-width: 72px;
            min-height: 35px;
            height: auto;
        }
        .multi-field {
            align-items: center;
            display: flex;
        }
        .toggle {
            display: none;
        }
        .toggle + span {
            display: flex;
            height: 100%;
            opacity: 1;
            border: 1px solid #909090;
            background-color: #3d74ff;
            color: white;
            cursor: pointer;
            padding: 0px 5px 0 5px;
            border-radius: 4px;
            justify-content: center;
            align-items: center;
        }
        .toggle:checked + span {
            opacity: 0.35;
            background-color: white;
            color: black;
        }
        .toggle:not(:checked) + span::before {
            content: "✔";
            color: #00ff1e;
        }
        .toggle:checked + span::before {
            content: "✖";
        }
        .toggle + span::after {
            content: attr(aria-label);
            margin-left: 5px;
        }
        .hide label {
            position: relative;
            margin-right: 2px;
        }
        .scrollable {
            scrollbar-width: thin;
            scrollbar-color: rgba(155, 155, 155, 0.5) transparent;
        }
        fieldset > div.scrollable {
            max-height: 70px;
            overflow-y: auto;
        }
        select[name="smallPlayerWidth"] {
            max-width: 90px;
        }
        a, a:visited {
            color: blue;
        }
        [hidden] {
            display: none;
        }
        @keyframes glow {
            from {
                fill: black;
                transform: scale(1);
            }
            to {
                fill: gold;
                transform: scale(1.5);
            }
        }
        .glow > svg {
            animation-name: glow;
            animation-duration: 0.5s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }
        .top-buttons {
            display: flex;
            position: absolute;
            justify-content: end;
            width: 100%;
            right: 0;
        }
        .top-buttons button {
            padding: 0 4px 0 4px;
        }
        #language {
            margin-right: auto;
            max-width: 130px;
            color: #606060;
        }
        #version {
            align-self: center;
            margin-right: 4px;
            font-size: 10px;
            color: grey;
        }
        #github-button img {
            height: 20px;
            margin-top: 2px;
            opacity: 0.5;
        }
        .donate-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .donate-text-wrapper {
            display: flex;
            position: absolute;
            transition-duration: 0.5s;
            gap: 0px;
            font-size: 150%;
            font-weight: bold;
            opacity: 0;
            white-space: nowrap;
        }
        .donate-wrapper:hover .donate-text-wrapper {
            gap: 200px;
            opacity: 1;
        }
      </style>
    </head>
    <body>
        <div class="top-buttons">
            <button id="github-button" data-i18n-title="titleGithub"><img src="/images/github-logo.png"></button>
            <select id="language" name="language" class="settings" data-i18n-title="languageTitle">

                <option value="en">English</option>
                <option value="id">Bahasa Indonesia</option>
            </select>
            <span id="version"></span>
            <button id="export-config" data-i18n-title="titleExport"><img src="/images/export-icon.svg"></button>
            <button id="restore-defaults" data-i18n-title="titleRestore"><img src="/images/restore-defaults-icon.svg"></button>
        </div>
        <div id="header"><span>YouTube Redux</span></div>
        <fieldset style="position:relative; border: none;">
            <legend data-i18n="settingsLegend"></legend>
            <div id="pages-wrapper" style="overflow-x: clip;">
                <div id="all-pages" active-page="1">
                    <div id="page-1" class="page">

                            <redux data-i18n="secGeneral"></redux>

                            <label><input type="checkbox" name="extraLayout" class="settings"><span data-i18n="extraLayout"></span><div class="tooltip"><span class="tooltip-text-small"><span data-i18n="extraLayoutTip"></span><br><span class="tooltip-warning-text" data-i18n="extraLayoutWarn"></span></span></div></label>
                            <div class="subsettings-container">
                                <label class="subsetting"><input type="checkbox" name="extraComments" class="settings" disabled><span data-i18n="extraComments"></span></label>
                                <label class="subsetting"><input type="checkbox" name="darkerRed" class="settings" disabled><span data-i18n="darkerRed"></span></label>
                                <label class="subsetting"><input type="checkbox" name="noHomeScalingRe" class="settings" disabled><span data-i18n="noHomeScaling"></span><div class="tooltip"><span class="tooltip-text-small" data-i18n="noHomeScalingTip"></span></div></label>
                                <label class="subsetting"><input type="checkbox" name="extraSidebarStyles" class="settings" disabled><span data-i18n="extraSidebarStyles"></span></label>
                            </div>
                            <label><input type="checkbox" name="playlistsFirst" class="settings"><span data-i18n="playlistsFirst"></span></label>
                            <div class="subsettings-container">
                                <label class="subsetting"><input type="checkbox" name="sortFoundPlaylists" class="settings" disabled><span data-i18n="sortFoundPlaylists"></span><div class="tooltip"><span class="tooltip-text-small" data-i18n="sortFoundPlaylistsTip"></span></div></label>
                            </div>
                            <redux data-i18n="secVideoPage"></redux>
                            <label style="display:inline-block">
                                <input type="checkbox" name="smallPlayer" class="settings"><span data-i18n="smallPlayer"></span>
                                <label style="display:inline-block"><select name="smallPlayerWidth" class="settings">
                                    <option value=427></option>
                                    <option value=640></option>
                                    <option value=768></option>
                                    <option value=853 style="background-color: #dbe1f8;"></option>
                                    <option value=938></option>
                                    <option value=1066></option>
                                    <option value=Custom></option>
                                    </select>
                                    <div class="tooltip" style="right: 1px;"><span class="tooltip-text" data-i18n="smallPlayerTip"></span></div>
                                </label>
                            </label>
                            <div class="subsettings-container">
                                <label class="subsetting"><input type="checkbox" name="blackBars" class="settings" disabled><span data-i18n="blackBars"></span><div class="tooltip"><span class="tooltip-text-small" data-i18n="blackBarsTip"></span></div></label>
                            </div>
                        </div>
                        <div style="flex: 0 0 50%;">
                            <label><input type="checkbox" name="disableInfiniteScrolling" class="settings"><span data-i18n="disableInfiniteScrolling"></span><div class="tooltip"><span class="tooltip-text-small" data-i18n="disableInfiniteScrollingTip"></span></div></label>
                            <label><input type="checkbox" name="autoConfirm" class="settings"><span data-i18n="autoConfirm"></span></label>
                            <label><input type="checkbox" name="showRawValues" class="settings"><span data-i18n="showRawValues"></span><div class="tooltip"><span class="tooltip-text-small" data-i18n="showRawValuesTip"></span></div></label>
                            <label><input type="checkbox" name="classicLikesColors" class="settings"><span data-i18n="classicLikesColors"></span></label>
                            <label><input type="checkbox" name="classicLikesIconColors" class="settings"><span data-i18n="classicLikesIconColors"></span></label>
                            <label><input type="checkbox" name="classicLikesStyle" class="settings"><span data-i18n="classicLikesStyle"></span></label>
                            <label><input type="checkbox" name="darkPlaylist" class="settings"><span data-i18n="darkPlaylist"></span></label>
                            <label><input type="checkbox" name="immersiveFullscreen" class="settings"><span data-i18n="immersiveFullscreen"></span><div class="tooltip"><span class="tooltip-text-small" data-i18n="immersiveFullscreenTip"></span></div></label>
                            <label hidden><input type="checkbox" name="trueFullscreen" class="settings"><span data-i18n="trueFullscreen"></span><div class="tooltip"><span class="tooltip-text-small" data-i18n="trueFullscreenTip"></span></div></label>
                            <label><input type="checkbox" name="subBorder" class="settings"><span data-i18n="subBorder"></span></label>
                            <label><input type="checkbox" name="trimSubs" class="settings"><span data-i18n="trimSubs"></span><div class="tooltip"><span class="tooltip-text-small" data-i18n="trimSubsTip"></span></div></label>
                            <label><input type="checkbox" name="trimViews" class="settings"><span data-i18n="trimViews"></span></label>
                            <label><input type="checkbox" name="altStrings" class="settings"><span data-i18n="altStrings"></span><div class="tooltip"><span class="tooltip-text-small" data-i18n="altStringsTip"></span></div></label>
                            <label><input type="checkbox" name="noPlayerActionAnimations" class="settings"><span data-i18n="noPlayerActionAnimations"></span><div class="tooltip"><span class="tooltip-text-small" data-i18n="noPlayerActionAnimationsTip"></span></div></label>
                            <label><input type="checkbox" name="moveAutoplay" class="settings"><span data-i18n="moveAutoplay"></span></label>
                            <label><input type="checkbox" name="disableMiniplayer" class="settings"><span data-i18n="disableMiniplayer"></span></label>
                        </div>
                    </div>
                    <div id="page-2" class="page">
                        <div style="flex: 0 0 50%; overflow-y: auto; max-height: 290px;" class="scrollable">
                            <redux data-i18n="secMisc"></redux>
                            <label><input type="checkbox" name="compatibleDislikesRe" class="settings"><span data-i18n="compatibleDislikes"></span><div class="tooltip"><span class="tooltip-text" data-i18n="compatibleDislikesTip"></span></div></label>
                            <label><input type="checkbox" name="redirectShorts" class="settings"><span data-i18n="redirectShorts"></span></label>
                            <label><input type="checkbox" name="oldIcons" class="settings"><span data-i18n="oldIcons"></span><div class="tooltip"><span class="tooltip-text" data-i18n="oldIconsTip"></span></div></label>
                            <label><input type="checkbox" name="altUploadIcon" class="settings"><span data-i18n="altUploadIcon"></span></label>
                            <label><input type="checkbox" name="extraChannel" class="settings"><span data-i18n="extraChannel"></span></label>
                            <label><input type="checkbox" name="squareAvatar" class="settings"><span data-i18n="squareAvatar"></span></label>
                            <label><input type="checkbox" name="squareSubs" class="settings"><span data-i18n="squareSubs"></span></label>
                            <label><input type="checkbox" name="squareSearch" class="settings"><span data-i18n="squareSearch"></span></label>
                            <label><input type="checkbox" name="squareComments" class="settings"><span data-i18n="squareComments"></span></label>
                            <label><input type="checkbox" name="altLoader" class="settings"><span data-i18n="altLoader"></span></label>
                            <div class="subsettings-container">
                                <label class="subsetting"><input type="checkbox" name="altLoaderSmaller" class="settings" disabled><span data-i18n="altLoaderSmaller"></span></label>
                            </div>
                            <label style="display:inline-block">
                                <input type="checkbox" name="customTitleFont" class="settings"><span data-i18n="customTitleFont"></span>
                                <label style="display:inline-block">
                                    <select name="titleFontValue" class="settings">
                                        <option value=Arial>Arial</option>
                                        <option value=Montserrat>Montserrat</option>
                                        <option value="Comic Sans MS">Comic Sans</option>
                                        <option value="Motiva Sans">Motiva Sans</option>
                                        <option value=Helvetica>Helvetica</option>
                                        <option value=Lato>Lato</option>
                                        <option value="Century Gothic">Cent.Gothic</option>
                                        <option value=Custom data-i18n="custom"></option>
                                    </select>
                                </label>
                            </label>
                            <label><input type="checkbox" name="collapseSidebar" class="settings"><span data-i18n="collapseSidebar"></span></label>
                            <label><input type="checkbox" name="disableVideoPreview" class="settings"><span data-i18n="disableVideoPreview"></span><div class="tooltip"><span class="tooltip-text" data-i18n="disableVideoPreviewTip"></span></div></label>
                            <label><input type="checkbox" name="autoExpandSidebarSections" class="settings"><span data-i18n="autoExpandSidebarSections"></span></label>
                            <label><input type="checkbox" name="ignoreAmbientAdjustment" class="settings"><span data-i18n="ignoreAmbientAdjustment"></span><div class="tooltip"><span class="tooltip-text" data-i18n="ignoreAmbientAdjustmentTip"></span></div></label>

                        <div style="flex: 0 0 50%;">
                            <redux style="margin: 5px 0 5px 0;"></redux>

                            <label><input type="checkbox" name="rearrangeInfo2" class="settings"><span data-i18n="rearrangeInfo"></span><div class="tooltip"><span class="tooltip-text" data-i18n="rearrangeInfoTip"></span></div></label>
                            <fieldset style="padding-top: 0; padding-bottom: 0; position: relative;"><legend data-i18n="logoLegend"></legend>
                                <div class="logo-preview"><img src='' style="height: 100%; width: 100%;"></div>
                                <div style="text-align: center; display:flex; justify-content: center; align-items: center; flex-wrap: wrap;">
                                    <label class="logo-label"><input type="radio" name="classicLogoChoice" class="settings" value=XL style="display:inline-block;">XL</label>
                                    <label class="logo-label"><input type="radio" name="classicLogoChoice" class="settings" value=2005 style="display:inline-block;">2005</label>

                            <fieldset style="padding-top: 0; padding-bottom: 0;"><legend><span data-i18n="filterLegend"></span><div class="tooltip" style="right: 1px;"><span class="tooltip-text-small" data-i18n="filterTip"></span></div></legend>
                                <div style="text-align: center">
                                    <label style="display:inline-block"><input type="checkbox" name="filterMiniRe" class="settings"><span data-i18n="filterMini"></span></label>
                                    <label style="display:inline-block"><input type="checkbox" name="filterMainRe" class="settings"><span data-i18n="filterNoHome"></span></label>
                                    <label style="display:inline-block"><input type="checkbox" name="filterVideo" class="settings"><span data-i18n="filterNoVideo"></span></label>
                                </div>
                            </fieldset>
                            <label hidden><input type="checkbox" name="completedSettingsTutorial" class="settings"></label>
                        </div>
                    </div>
                    <div id="page-3" class="page">
                        <div style="display: flex; flex-direction: column;">
                            <redux style="margin: 5px 0 5px 0;"><span data-i18n="secVisibility"></span>
                                <div class="tooltip" style="right: 1px; font-weight: normal; font-family: unset;">
                                    <span class="tooltip-text" style="font-weight: normal; transform: translateY(-5%);" data-i18n="visibilityTip"></span>
                                </div>
                            </redux>
                            <div style="padding-top: 0; padding-bottom: 0; display:flex; flex-basis: 100%;" class="hide">
                                <div style="display: flex; width: 100%; justify-content: center; flex-wrap: wrap;" class="scrollable">
                                    <label class="toggle-label"><input type="checkbox" name="hideShorts" class="settings toggle"><span data-i18n-aria-label="visShorts"></span></label>
                                    <label class="toggle-label"><input type="checkbox" name="hideRelatedVideoAgeRe" class="settings toggle"><span data-i18n-aria-label="visRelatedAge"></span></label>
                                    <label class="toggle-label"><input type="checkbox" name="hideAutoplayButton" class="settings toggle"><span data-i18n-aria-label="visAutoplay"></span></label>
                                    <label class="toggle-label"><input type="checkbox" name="hideVoiceSearch" class="settings toggle"><span data-i18n-aria-label="visVoiceSearch"></span></label>
                                    <label class="toggle-label"><input type="checkbox" name="hideCastButton" class="settings toggle"><span data-i18n-aria-label="visCast"></span></label>
                                    <label class="toggle-label"><input type="checkbox" name="hideJoinButton" class="settings toggle"><span data-i18n-aria-label="visJoin"></span></label>
