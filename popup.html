<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="color-scheme" content="light dark">
	<title>ClassicYT</title>
	<link rel="stylesheet" href="ui.css">
	<style>
		html, body {
			inline-size: 408px;
		}
		body {
			display: flex;
			flex-direction: column;
			block-size: 580px;
			overflow: hidden;
		}
		.panels {
			flex: 1;
			overflow-y: auto;
			scrollbar-gutter: stable;
		}
		.panel-body {
			padding: 14px 10px 18px 12px;
		}
		.stacked {
			flex-direction: column;
			align-items: stretch;
			gap: 8px;
		}
		.slider-field {
			display: flex;
			align-items: center;
			gap: 10px;
		}
		.slider-field input[type="range"] {
			flex: 1;
			margin: 0;
		}
		.number-input {
			inline-size: 58px;
			text-align: center;
		}
		.row-static > label.row-title {
			flex: 1;
			cursor: pointer;
		}
		.custom-field .text-input {
			flex: 1;
		}
		fieldset.group {
			margin: 0;
			padding: 0;
			border: 0;
			min-inline-size: 0;
		}
		fieldset.group > legend {
			margin-block-end: 6px;
			padding: 0;
		}
		fieldset.group > .group-desc {
			margin-block-end: 6px;
		}
		.choice-grid {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 6px;
		}
		.choice-grid.favicons {
			grid-template-columns: repeat(3, 1fr);
		}
		.choice {
			position: relative;
			display: grid;
			justify-items: center;
			align-content: center;
			gap: 6px;
			min-block-size: 62px;
			padding: 8px 6px;
			border: 1px solid var(--border);
			border-radius: var(--radius-sm);
			background: var(--surface);
			color: var(--text-muted);
			font-size: 11.5px;
			font-weight: 500;
			text-align: center;
			cursor: pointer;
			transition: background-color .15s, border-color .15s;
		}
		.favicons .choice {
			min-block-size: 44px;
		}
		.choice img {
			block-size: 22px;
			max-inline-size: 100%;
			object-fit: contain;
		}
		.favicons .choice img {
			block-size: 16px;
			inline-size: 16px;
		}
		.choice:hover {
			background: var(--surface-hover);
		}
		.choice:has(:checked) {
			border-color: var(--accent);
			box-shadow: inset 0 0 0 1px var(--accent);
			background: var(--accent-soft);
			color: var(--text);
		}
		.choice:has(:focus-visible) {
			outline: 2px solid var(--focus);
			outline-offset: 2px;
		}
		@media (forced-colors: active) {
			.choice:has(:checked) {
				border: 3px solid Highlight;
			}
		}
		.visibility-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
		}
		.btn-small {
			min-block-size: 28px;
			padding: 0 10px;
			font-size: 12px;
		}
		.btn-small .icon {
			inline-size: 16px;
			block-size: 16px;
		}
		.app-footer {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 9px 14px;
			background: var(--surface);
			border-block-start: 1px solid var(--border);
			color: var(--text-muted);
			font-size: 11.5px;
		}
		.app-footer > span {
			flex: 1;
		}
		.app-footer .link-btn {
			flex: none;
			font-size: 11.5px;
		}
	</style>
</head>
<body>
	<svg hidden>
		<symbol id="i-import-export" viewBox="0 0 24 24"><path d="M9 3 5 6.99h3V14h2V6.99h3L9 3zm7 14.01V10h-2v7.01h-3L15 21l4-3.99h-3z"/></symbol>
		<symbol id="i-restore" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></symbol>
		<symbol id="i-code" viewBox="0 0 24 24"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></symbol>
		<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
		<symbol id="i-info" viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></symbol>

	<header class="app-bar">
		<img class="app-logo" src="images/48.png" alt="">
		<div class="app-title">
			<span class="app-name">ClassicYT</span>
			<span id="version" class="badge"></span>
		</div>
		<div class="app-actions">
			<button type="button" id="export-config" class="icon-btn" data-i18n-title="titleExport" data-i18n-aria-label="titleExport"><svg class="icon" aria-hidden="true"><use href="#i-import-export"/></svg></button>
			<button type="button" id="restore-defaults" class="icon-btn" data-i18n-title="titleRestore" data-i18n-aria-label="titleRestore"><svg class="icon" aria-hidden="true"><use href="#i-restore"/></svg></button>
			<a id="github-button" class="icon-btn" href="https://github.com/andrizan/ClassicYT" target="_blank" rel="noopener" data-i18n-title="titleGithub" data-i18n-aria-label="titleGithub"><svg class="icon" aria-hidden="true"><use href="#i-code"/></svg></a>
		</div>
	</header>

	<div class="tabs" role="tablist" data-i18n-aria-label="settingsLegend">
		<button type="button" role="tab" id="tab-general" aria-selected="true" data-i18n="secGeneral"></button>
		<button type="button" role="tab" id="tab-video" aria-selected="false" tabindex="-1" data-i18n="secVideoPage"></button>
		<button type="button" role="tab" id="tab-misc" aria-selected="false" tabindex="-1" data-i18n="secMisc"></button>
		<button type="button" role="tab" id="tab-visibility" aria-selected="false" tabindex="-1" data-i18n="tabVisibility"></button>
	</div>

	<main class="panels">
		<section role="tabpanel" id="panel-general" aria-labelledby="tab-general">
			<div class="panel-body">
				<div class="group">
					<div class="card">
						<div class="row row-static">
							<label class="row-title" for="language" data-i18n="languageTitle"></label>
							<select id="language" name="language" class="settings select">
								<option value="auto" data-i18n="languageAuto"></option>
								<option value="en">English</option>
								<option value="id">Bahasa Indonesia</option>
							</select>
						</div>
					</div>
				</div>

				<div class="group">
					<h2 class="group-title" data-i18n="groupLayout"></h2>
					<div class="card">
						<div class="row row-static stacked">
							<label class="row-text" for="grid-items">

								<span class="row-desc" data-i18n="gridItemsTip"></span>
							</label>
							<div class="slider-field">
								<input type="range" id="grid-items" min="1" max="10" name="gridItems" class="settings">
								<input type="number" min="1" max="10" class="settings slider-control text-input number-input" data-i18n-aria-label="gridItems">
							</div>
						</div>
						<label class="row">
							<span class="row-text">
								<span class="row-title" data-i18n="extraLayout"></span>
								<span class="row-desc"><span data-i18n="extraLayoutTip"></span> <span class="row-warning" data-i18n="extraLayoutWarn"></span></span>
							</span>
							<input type="checkbox" role="switch" name="extraLayout" class="settings switch">
						</label>
						<div class="subsettings-container">
							<label class="row subsetting"><span class="row-text"><span class="row-title" data-i18n="extraComments"></span></span><input type="checkbox" role="switch" name="extraComments" class="settings switch" disabled></label>
							<label class="row subsetting"><span class="row-text"><span class="row-title" data-i18n="darkerRed"></span></span><input type="checkbox" role="switch" name="darkerRed" class="settings switch" disabled></label>
							<label class="row subsetting"><span class="row-text"><span class="row-title" data-i18n="noHomeScaling"></span><span class="row-desc" data-i18n="noHomeScalingTip"></span></span><input type="checkbox" role="switch" name="noHomeScalingRe" class="settings switch" disabled></label>
							<label class="row subsetting"><span class="row-text"><span class="row-title" data-i18n="extraSidebarStyles"></span></span><input type="checkbox" role="switch" name="extraSidebarStyles" class="settings switch" disabled></label>
						</div>
						<label class="row">
							<span class="row-text"><span class="row-title" data-i18n="playlistsFirst"></span></span>
							<input type="checkbox" role="switch" name="playlistsFirst" class="settings switch">
						</label>
						<div class="subsettings-container">
							<label class="row subsetting"><span class="row-text"><span class="row-title" data-i18n="sortFoundPlaylists"></span><span class="row-desc" data-i18n="sortFoundPlaylistsTip"></span></span><input type="checkbox" role="switch" name="sortFoundPlaylists" class="settings switch" disabled></label>
						</div>
					</div>
				</div>

				<fieldset class="group">
					<legend class="group-title" data-i18n="logoLegend"></legend>
					<div class="choice-grid">
						<label class="choice"><input type="radio" name="classicLogoChoice" class="settings visually-hidden" value="XL"><picture><source srcset="images/XLlogo-dark.png" media="(prefers-color-scheme: dark)"><img src="images/XLlogo.png" alt=""></picture><span>XL</span></label>
						<label class="choice"><input type="radio" name="classicLogoChoice" class="settings visually-hidden" value="2005"><picture><source srcset="images/2005logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="images/2005logo.svg" alt=""></picture><span>2005</span></label>
						<label class="choice"><input type="radio" name="classicLogoChoice" class="settings visually-hidden" value="2005alt"><picture><source srcset="images/2005altlogo-dark.svg" media="(prefers-color-scheme: dark)"><img src="images/2005altlogo.svg" alt=""></picture><span>2005 (alt)</span></label>
						<label class="choice"><input type="radio" name="classicLogoChoice" class="settings visually-hidden" value="2011"><picture><source srcset="images/2011logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="images/2011logo.svg" alt=""></picture><span>2011</span></label>
						<label class="choice"><input type="radio" name="classicLogoChoice" class="settings visually-hidden" value="2013"><picture><source srcset="images/2013logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="images/2013logo.svg" alt=""></picture><span>2013</span></label>
						<label class="choice"><input type="radio" name="classicLogoChoice" class="settings visually-hidden" value="2015"><picture><source srcset="images/2015logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="images/2015logo.svg" alt=""></picture><span>2015</span></label>
						<label class="choice"><input type="radio" name="classicLogoChoice" class="settings visually-hidden" value="2015alt"><picture><source srcset="images/2015altlogo-dark.svg" media="(prefers-color-scheme: dark)"><img src="images/2015altlogo.svg" alt=""></picture><span>2015 (alt)</span></label>
						<label class="choice"><input type="radio" name="classicLogoChoice" class="settings visually-hidden" value="2017"><picture><source srcset="images/2017logo-dark.svg" media="(prefers-color-scheme: dark)"><img src="images/2017logo.svg" alt=""></picture><span>2017</span></label>
					</div>
				</fieldset>

				<fieldset class="group">
					<legend class="group-title" data-i18n="faviconLegend"></legend>
					<div class="choice-grid favicons">
						<label class="choice"><input type="radio" name="favicon" class="settings visually-hidden" value="1"><img src="images/favicon1.ico" alt="Favicon 1"></label>
						<label class="choice"><input type="radio" name="favicon" class="settings visually-hidden" value="2"><img src="images/favicon2.png" alt="Favicon 2"></label>
						<label class="choice"><input type="radio" name="favicon" class="settings visually-hidden" value="3"><img src="images/favicon3.ico" alt="Favicon 3"></label>
					</div>
				</fieldset>

				<fieldset class="group">
					<legend class="group-title" data-i18n="filterLegend"></legend>
					<p class="group-desc" data-i18n="filterTip"></p>
					<div class="card">
						<label class="row compact"><span class="row-text"><span class="row-title" data-i18n="filterMini"></span></span><input type="checkbox" role="switch" name="filterMiniRe" class="settings switch"></label>
						<label class="row compact"><span class="row-text"><span class="row-title" data-i18n="filterNoHome"></span></span><input type="checkbox" role="switch" name="filterMainRe" class="settings switch"></label>
						<label class="row compact"><span class="row-text"><span class="row-title" data-i18n="filterNoVideo"></span></span><input type="checkbox" role="switch" name="filterVideo" class="settings switch"></label>
					</div>
				</fieldset>
			</div>
		</section>

		<section role="tabpanel" id="panel-video" aria-labelledby="tab-video" hidden="until-found">
			<div class="panel-body">
				<div class="group">
					<h2 class="group-title" data-i18n="groupPlayer"></h2>
					<div class="card">
						<label class="row">
							<span class="row-text"><span class="row-title" data-i18n="smallPlayer"></span><span class="row-desc" data-i18n="smallPlayerTip"></span></span>

						<div class="subsettings-container">
							<div class="row row-static subsetting">
								<label class="row-title" for="player-size" data-i18n="playerSize"></label>
								<select id="player-size" name="smallPlayerWidth" class="settings select" disabled>
									<option value="427"></option>
									<option value="640"></option>
									<option value="768"></option>
									<option value="853"></option>
									<option value="938"></option>
									<option value="1066"></option>
									<option value="Custom"></option>
								</select>
							</div>
							<form class="row row-static subsetting custom-field" id="player-size-custom" hidden>
								<input type="number" class="text-input" min="200" max="7680" step="1" placeholder="900" required data-i18n-aria-label="customWidth" data-i18n-title="customWidth" disabled>
								<button type="submit" class="btn" data-i18n="apply"></button>
							</form>
							<label class="row subsetting"><span class="row-text"><span class="row-title" data-i18n="blackBars"></span><span class="row-desc" data-i18n="blackBarsTip"></span></span><input type="checkbox" role="switch" name="blackBars" class="settings switch" disabled></label>
						</div>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="immersiveFullscreen"></span><span class="row-desc" data-i18n="immersiveFullscreenTip"></span></span><input type="checkbox" role="switch" name="immersiveFullscreen" class="settings switch"></label>
						<label class="row" hidden><span class="row-text"><span class="row-title" data-i18n="trueFullscreen"></span><span class="row-desc" data-i18n="trueFullscreenTip"></span></span><input type="checkbox" role="switch" name="trueFullscreen" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="noPlayerActionAnimations"></span><span class="row-desc" data-i18n="noPlayerActionAnimationsTip"></span></span><input type="checkbox" role="switch" name="noPlayerActionAnimations" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="disableMiniplayer"></span></span><input type="checkbox" role="switch" name="disableMiniplayer" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="moveAutoplay"></span></span><input type="checkbox" role="switch" name="moveAutoplay" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="autoConfirm"></span></span><input type="checkbox" role="switch" name="autoConfirm" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="darkPlaylist"></span></span><input type="checkbox" role="switch" name="darkPlaylist" class="settings switch"></label>
					</div>
				</div>

				<div class="group">
					<h2 class="group-title" data-i18n="groupVideoDetails"></h2>
					<div class="card">
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="rearrangeInfo"></span><span class="row-desc" data-i18n="rearrangeInfoTip"></span></span><input type="checkbox" role="switch" name="rearrangeInfo2" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="disableInfiniteScrolling"></span><span class="row-desc" data-i18n="disableInfiniteScrollingTip"></span></span><input type="checkbox" role="switch" name="disableInfiniteScrolling" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="showRawValues"></span><span class="row-desc" data-i18n="showRawValuesTip"></span></span><input type="checkbox" role="switch" name="showRawValues" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="classicLikesColors"></span></span><input type="checkbox" role="switch" name="classicLikesColors" class="settings switch"></label>

						<label class="row"><span class="row-text"><span class="row-title" data-i18n="classicLikesStyle"></span></span><input type="checkbox" role="switch" name="classicLikesStyle" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="subBorder"></span></span><input type="checkbox" role="switch" name="subBorder" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="trimSubs"></span><span class="row-desc" data-i18n="trimSubsTip"></span></span><input type="checkbox" role="switch" name="trimSubs" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="trimViews"></span></span><input type="checkbox" role="switch" name="trimViews" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="altStrings"></span><span class="row-desc" data-i18n="altStringsTip"></span></span><input type="checkbox" role="switch" name="altStrings" class="settings switch"></label>
					</div>
				</div>
			</div>
		</section>

		<section role="tabpanel" id="panel-misc" aria-labelledby="tab-misc" hidden="until-found">
			<div class="panel-body">
				<div class="group">
					<h2 class="group-title" data-i18n="groupAppearance"></h2>
					<div class="card">
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="oldIcons"></span><span class="row-desc" data-i18n="oldIconsTip"></span></span><input type="checkbox" role="switch" name="oldIcons" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="altUploadIcon"></span></span><input type="checkbox" role="switch" name="altUploadIcon" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="extraChannel"></span></span><input type="checkbox" role="switch" name="extraChannel" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="squareAvatar"></span></span><input type="checkbox" role="switch" name="squareAvatar" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="squareSubs"></span></span><input type="checkbox" role="switch" name="squareSubs" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="squareSearch"></span></span><input type="checkbox" role="switch" name="squareSearch" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="squareComments"></span></span><input type="checkbox" role="switch" name="squareComments" class="settings switch"></label>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="altLoader"></span></span><input type="checkbox" role="switch" name="altLoader" class="settings switch"></label>
						<div class="subsettings-container">
							<label class="row subsetting"><span class="row-text"><span class="row-title" data-i18n="altLoaderSmaller"></span></span><input type="checkbox" role="switch" name="altLoaderSmaller" class="settings switch" disabled></label>
						</div>
						<label class="row"><span class="row-text"><span class="row-title" data-i18n="customTitleFont"></span></span><input type="checkbox" role="switch" name="customTitleFont" class="settings switch"></label>
						<div class="subsettings-container">
							<div class="row row-static subsetting">
								<label class="row-title" for="title-font" data-i18n="titleFont"></label>
								<select id="title-font" name="titleFontValue" class="settings select" disabled>
									<option value="Arial">Arial</option>
									<option value="Montserrat">Montserrat</option>
									<option value="Comic Sans MS">Comic Sans</option>
									<option value="Motiva Sans">Motiva Sans</option>
									<option value="Helvetica">Helvetica</option>
									<option value="Lato">Lato</option>
									<option value="Century Gothic">Century Gothic</option>
									<option value="Custom" data-i18n="custom"></option>
								</select>
							</div>
							<form class="row row-static subsetting custom-field" id="title-font-custom" hidden>
								<input type="text" class="text-input" placeholder="Times New Roman" required spellcheck="false" data-i18n-aria-label="customFont" data-i18n-title="customFont" disabled>
								<button type="submit" class="btn" data-i18n="apply"></button>
							</form>
						</div>
					</div>
				</div>

				<div class="group">
					<h2 class="group-title" data-i18n="groupBehavior"></h2>
