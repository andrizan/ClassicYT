<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<link rel="icon" type="image/png" href="./images/32.png">
	<title>ClassicYT</title>
	<link rel="stylesheet" href="ui.css">
	<style>
		.page {
			max-inline-size: 980px;
			margin: 0 auto;
			padding: 28px 16px 40px;
		}
		.page-header {
			display: flex;
			align-items: center;
			gap: 12px;
			margin-block-end: 22px;
		}
		.page-header .app-logo {
			inline-size: 36px;
			block-size: 36px;
		}
		.page-header h1 {
			font-size: 20px;
			font-weight: 650;
			letter-spacing: -0.01em;
		}
		.config-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr));
			gap: 16px;
		}
		.config-card {
			display: flex;
			flex-direction: column;
			gap: 12px;
			padding: 18px;
		}
		.config-card h2 {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 15px;
			font-weight: 650;
		}
		.config-card h2 .icon {
			fill: var(--accent);
		}
		.config-card p {
			color: var(--text-muted);
		}
		.config-card .textarea {
			flex: 1;
			min-block-size: 280px;
		}
		.actions {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 8px;
		}
		.hint {
			color: var(--text-muted);
			font-size: 12px;
		}
	</style>
</head>
<body>
	<svg hidden>
		<symbol id="i-upload" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm0-10h4v6h6v-6h4l-7-7-7 7z"/></symbol>
		<symbol id="i-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
		<symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
	</svg>

	<main class="page">
		<header class="page-header">
			<img class="app-logo" src="images/48.png" alt="">
			<h1 data-i18n="configHeader"></h1>
		</header>

		<div class="config-grid">
			<section class="card config-card" aria-labelledby="export-title">
				<h2 id="export-title"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg><span data-i18n="exportTitle"></span></h2>
				<p data-i18n="exportDesc"></p>
				<textarea id="export-area" class="textarea" spellcheck="false" readonly aria-labelledby="export-title" data-i18n-placeholder="exportPlaceholder"></textarea>
				<div class="actions">
					<button type="button" id="copy-button" class="btn btn-primary" data-i18n="copyButton"></button>
					<button type="button" id="export-file-button" class="btn" data-i18n="exportToFile"></button>
					<span class="hint" data-i18n="requiresDownload"></span>
				</div>
			</section>

			<section class="card config-card" aria-labelledby="import-title">
				<h2 id="import-title"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="importTitle"></span></h2>
				<p data-i18n="importDesc"></p>
				<textarea id="import-area" class="textarea" spellcheck="false" aria-labelledby="import-title" data-i18n-placeholder="importPlaceholder"></textarea>
				<div class="actions">
					<button type="button" id="import-button" class="btn btn-primary" data-i18n="importButton"></button>
					<button type="button" id="import-file-button" class="btn" data-i18n="importFromFile"></button>
					<input type="file" id="import-file" accept="application/json,.json" hidden>
				</div>
			</section>
		</div>
	</main>

	<div id="toasts" role="region" data-i18n-aria-label="notifications"></div>
	<div id="announcer" class="visually-hidden" aria-live="polite"></div>

	<script src="./helpers/settings.js"></script>
	<script src="./helpers/i18n.js"></script>
	<script src="./helpers/i18n-ui.js"></script>
	<script src="./config.js"></script>
</body>
</html>
