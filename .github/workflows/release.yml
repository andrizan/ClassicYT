name: Release

# Builds the extension, has it signed by Mozilla (unlisted), attaches the .xpi to a GitHub release and
# records the release in updates.json. Installed copies pick it up through the update_url in manifest.json.
#
# Required repository secrets (addons.mozilla.org -> Tools -> Manage API Keys):
#   AMO_JWT_ISSUER, AMO_JWT_SECRET
# Without them an unsigned build is published, which only Firefox builds with signature
# enforcement turned off (Developer Edition, Nightly, ESR) can install.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match the manifest version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "xpi=youtube_redux-$version.xpi" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: npx --yes web-ext@8 lint --self-hosted

      - name: Build and sign
        id: build
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          XPI: ${{ steps.version.outputs.xpi }}
        run: |
          if [ -n "$WEB_EXT_API_KEY" ] && [ -n "$WEB_EXT_API_SECRET" ]; then
            npx --yes web-ext@8 sign --channel=unlisted --artifacts-dir=dist
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AMO_JWT_ISSUER/AMO_JWT_SECRET are not set: publishing an unsigned build that release versions of Firefox refuse to install."
            npx --yes web-ext@8 build --artifacts-dir=dist
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          built="$(find dist -maxdepth 1 -type f \( -name '*.xpi' -o -name '*.zip' \) | head -n 1)"
          test -n "$built"
          mv "$built" "dist/$XPI"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          XPI: ${{ steps.version.outputs.xpi }}
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          notes="Install or update by opening the attached .xpi in Firefox. Installed copies update themselves."
          if [ "$SIGNED" != "true" ]; then
            notes="$notes"$'\n\n'"This build is NOT signed by Mozilla."
          fi
          gh release create "v$VERSION" "dist/$XPI" --title "v$VERSION" --notes "$notes" --target "$GITHUB_SHA"

      - name: Publish update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          XPI: ${{ steps.version.outputs.xpi }}
          BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          node .github/scripts/update-manifest.mjs "$VERSION" "https://github.com/$REPOSITORY/releases/download/v$VERSION/$XPI" "dist/$XPI"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "chore(release): publish update manifest for v$VERSION"
          git push origin "$BRANCH"
